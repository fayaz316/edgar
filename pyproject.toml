[project]
name = "edgar-analyst"
version = "0.1.0"
description = "Citation-grounded AI research analyst over SEC filings — a one-person forward deployment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
  "pyyaml>=6.0",
  "psycopg-pool>=3.3.3",
  "mcp>=1.2",
  "langgraph>=1.2.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",          # TestClient transport
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml>=6.0.12.20261103",
]
local-embed = [
    "sentence-transformers>=3",
]
finetune = [
    "sentence-transformers>=3",
    "datasets>=3",
    "accelerate>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/gateway", "services/ingest", "services/tools", "services/mcp", "services/agent", "evals"]

[[tool.mypy.overrides]]
module = ["bs4.*", "sentence_transformers.*", "datasets.*", "torch.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "services/tests",
  "services/gateway/tests",
  "services/ingest/tests",
  "services/tools/tests",
  "services/mcp/tests",
  "services/agent/tests",
  "evals/tests",
  "evals/finetune/tests",
]
addopts = "-q"

[tool.uv]
package = false  # app monorepo: uv sync installs deps only, no build/packaging
