name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv python install 3.12
      - run: uv sync
      - name: Lint + format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Terraform validate
        run: cd infra && terraform init -backend=false && terraform validate
        continue-on-error: true  # remove once CI gets GCP creds (Phase 1)
