# Golden set v0 — 30 items, hand-authored against the live corpus.
# Authoring rule: answer_type=numeric ONLY where the number was verified in a
# pulled passage. Refusal items are questions filings cannot support — the
# correctness-critical behavior is to SAY SO, not to guess.
# Referential integrity (accession+section exist in DB) is enforced by
# evals/validate_golden.py.

